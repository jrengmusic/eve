<!DOCTYPE html>
<html style="font-size:24px">
<head></head>
<body class="settings" style="width:420px;height:120px;display:flex;flex-direction:column;padding:16px;font-family:mono">
  <label id="title" data-parameter="TITLE" style="flex-basis:1.5em;flex-grow:0;flex-shrink:0;text-align:center;font-family:mono;font-size:20px;color:var(--caribbeanBlue);text-transform:uppercase">SETTINGS</label>
  <div id="new-instance" style="display:flex;flex-direction:row;flex-basis:52px;flex-grow:0;flex-shrink:0">
    <div id="new-instance-labels" style="display:flex;flex-direction:column;flex-basis:120px;flex-grow:0;flex-shrink:0;gap:2px">
      <label id="appearance-label" data-parameter="APPEARANCE_LABEL" style="flex-basis:1em;flex-grow:0;flex-shrink:0">APPEARANCE</label>
      <label id="ui-scale-label" data-parameter="UI_SCALE_LABEL" style="flex-basis:1em;flex-grow:0;flex-shrink:0">UI SCALE</label>
    </div>
    <div id="new-instance-widgets" style="display:flex;flex-direction:column;flex-grow:1;gap:2px">
      <select class="selector" id="appearance" data-parameter="APPEARANCE" style="flex-basis:1em;flex-grow:0;flex-shrink:0"></select>
      <select class="selector" id="ui-scale" data-parameter="UI_SCALE" style="flex-basis:1em;flex-grow:0;flex-shrink:0"></select>
    </div>
  </div>
</body>
</html>
